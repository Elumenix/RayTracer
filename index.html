<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayTracer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .bg-charcoal {
            background-color: #252526 !important;
        }

        .bg-header-footer {
            background-color: #2a2929 !important;
        }

        .progress-bar {
            transition: width 0.1s linear;
        }
    </style>
  <script type="module" crossorigin src="/RayTracer/assets/index-C93BtwII.js"></script>
  <link rel="stylesheet" crossorigin href="/RayTracer/assets/index-B9Qu5Tu6.css">
</head>

<body class="bg-charcoal text-light">

    <div class="container-fluid min-vh-100 d-flex flex-column p-0">

        <!-- Header / Github Link -->
        <nav class="navbar navbar-dark bg-header-footer py-1">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="https://github.com/Elumenix/RayTracer"
                    target="_blank">
                    <i class="bi bi-github me-2"></i>
                    RayTracer
                </a>
            </div>
        </nav>

        <!-- Top row: editor + canvas -->
        <div class="row flex-grow-1 m-0">
            <div class="col-md-6 d-flex flex-column p-0">
                <!-- Editor fills remaining height -->
                <div id="editor" class="flex-grow-1"></div>
            </div>
            <div class="col-md-6 d-flex flex-column p-0">
                <div id="canvas-container"
                    class="flex-grow-1 d-flex justify-content-center align-items-center position-relative">
                    <canvas id="output"></canvas>

                    <!-- Progress bar overlay -->
                    <div id="render-progress" class="progress position-absolute top-50 start-50 translate-middle d-none"
                        style="width: 60%; z-index: 10;" role="progressbar" aria-label="Render progress"
                        aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom row: controls -->
        <div class="row m-0 bg-header-footer p-1">
            <div class="col-md-6 p-2">
                <!-- Render button -->
                <button id="render-btn" class="btn btn-primary">Render</button>
            </div>
            <div class="col-md-6 p-2">
                <!-- Download button -->
                <button id="download-btn" class="btn btn-secondary" autocomplete="off" disabled>Download PNG</button>

                <!-- Toggle resolution checkbox -->
                <input type="checkbox" class="btn-check" id="toggle-fit-btn" autocomplete="off">
                <label class="btn btn-outline-secondary" for="toggle-fit-btn">Show Native Resolution</label><br>
            </div>
        </div>
    </div>

    <!-- Error Message -->
    <div class="modal fade" id="error-Modal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="errorModalLabel">Scene Error:</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div id="modal-body" class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Js -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
