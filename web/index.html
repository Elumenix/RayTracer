<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayTracer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid min-vh-100 d-flex flex-column p-0">

        <!-- Top row: editor + canvas -->
        <div class="row flex-grow-1 m-0">
            <div class="col-md-6 d-flex flex-column p-0">
                <!-- Editor fills remaining height -->
                <div id="editor" class="flex-grow-1"></div>
            </div>

            <div class="col-md-6 d-flex flex-column p-0">
                <!-- Canvas container fills remaining height -->
                <div id="canvas-container" class="flex-grow-1 d-flex justify-content-center align-items-center">
                    <canvas id="output"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom row: controls -->
        <div class="row m-0">
            <div class="col-md-6 p-2">
                <!-- Render button -->
                <button id="render-btn" class="btn btn-primary">Render</button>
            </div>
            <div class="col-md-6 p-2">
                <!-- Download button -->
                <button id="download-btn" class="btn btn-secondary" autocomplete="off" disabled>Download PNG</button>

                <!-- Toggle resolution checkbox -->
                <input type="checkbox" class="btn-check" id="toggle-fit-btn" autocomplete="off">
                <label class="btn btn-outline-secondary" for="toggle-fit-btn">Show Native Resolution</label><br>
            </div>
        </div>
    </div>





    <div id="error-box" style="color:red;"></div>


    <!-- Page Js -->
    <script type="module" src="/src/main.js"></script>

    <!-- RayTracer JS -->
    <script src="./raytracer.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
